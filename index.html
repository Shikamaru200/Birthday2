<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday!</title>
  <style>
    :root {
      --bg: #12131C;
      --card-bg: #1E1F2E;
      --accent: #FF5E7E;
      --accent-yellow: #FFD166;
      --text: #FFFFFF;
      --text-sub: #A0A5C0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    /* Container */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.3s ease;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 15px;
      margin-bottom: 30px;
    }

    /* Cake Styling */
    .cake-container {
      position: relative;
      width: 200px;
      height: 140px;
      margin: 0 auto 30px;
    }

    .cake-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: #FF85A1;
      border-radius: 12px;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.1);
    }

    .cake-bottom {
      bottom: 0;
      width: 180px;
      height: 60px;
    }

    .cake-top {
      bottom: 50px;
      width: 140px;
      height: 50px;
      background: #FFB3C1;
    }

    .icing {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 16px;
      background: #FFF;
      border-radius: 12px 12px 6px 6px;
    }

    /* Candles */
    .candles-group {
      position: absolute;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
    }

    .candle {
      width: 12px;
      height: 35px;
      background: repeating-linear-gradient(
        45deg,
        #4EA8DE,
        #4EA8DE 5px,
        #90E0EF 5px,
        #90E0EF 10px
      );
      border-radius: 4px;
      position: relative;
      cursor: pointer;
    }

    /* Flame */
    .flame {
      width: 12px;
      height: 18px;
      background: #FFD166;
      border-radius: 50% 50% 35% 35%;
      position: absolute;
      top: -18px;
      left: 0;
      box-shadow: 0 0 12px #FFD166, 0 0 20px #FF5E7E;
      animation: flicker 0.6s infinite alternate ease-in-out;
      transform-origin: center bottom;
    }

    .flame.off {
      display: none;
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.1) rotate(2deg); }
    }

    /* Message Reveal Box */
    .message-box {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      border: 1px dashed rgba(255,255,255,0.2);
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .message-box.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .message-box h2 {
      font-size: 22px;
      color: var(--accent-yellow);
      margin-bottom: 8px;
    }

    .message-box p {
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    /* Confetti Canvas */
    #confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <div class="card">
    <h1 id="title">Happy Birthday! 🎂</h1>
    <p class="subtitle" id="subtitle">Tap the candles to reveal your wish!</p>

    <!-- Cake with 3 Candles -->
    <div class="cake-container">
      <div class="candles-group">
        <div class="candle" onclick="extinguish(this)">
          <div class="flame"></div>
        </div>
        <div class="candle" onclick="extinguish(this)">
          <div class="flame"></div>
        </div>
        <div class="candle" onclick="extinguish(this)">
          <div class="flame"></div>
        </div>
      </div>
      <div class="cake-layer cake-top"><div class="icing"></div></div>
      <div class="cake-layer cake-bottom"><div class="icing"></div></div>
    </div>

    <!-- Hidden Message -->
    <div class="message-box" id="messageBox">
      <h2 id="recipient"> Happy Birthday Konica ✨</h2>
      <p id="note">Wishing you a year filled with success, laughter, and endless happy moments! Enjoy your special day! 🎉</p>
    </div>
  </div>

  <script>
    let activeFlames = 3;

    function extinguish(candleEl) {
      const flame = candleEl.querySelector('.flame');
      if (flame && !flame.classList.contains('off')) {
        flame.classList.add('off');
        activeFlames--;

        if (activeFlames === 0) {
          revealCard();
        }
      }
    }

    function revealCard() {
      document.getElementById('subtitle').innerText = "Make a wish! ✨";
      document.getElementById('messageBox').classList.add('visible');
      startConfetti();
    }

    /* Simple Confetti Effect */
    function startConfetti() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = [];
      const colors = ['#FF5E7E', '#FFD166', '#06D6A0', '#118AB2', '#FF85A1'];

      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          speedY: Math.random() * 3 + 2,
          speedX: Math.random() * 2 - 1,
          rot: Math.random() * 360,
          rotSpeed: Math.random() * 10 - 5
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speedY;
          p.x += p.speedX;
          p.rot += p.rotSpeed;

          if (p.y > canvas.height) p.y = -10;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
          ctx.restore();
        });
        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
